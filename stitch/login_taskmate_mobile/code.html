<body class="bg-background min-h-screen flex flex-col font-body-md text-text-primary antialiased selection:bg-secondary selection:text-on-secondary">
<!-- Header / Branding Area -->
<header class="bg-primary-container text-on-primary-container pt-xl pb-lg px-margin-mobile flex flex-col items-center justify-center text-center relative overflow-hidden">
<!-- Abstract Decoration -->
<div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(circle at 80% -20%, #ffffff 0%, transparent 60%);"></div>
<div class="z-10 flex flex-col items-center">
<div class="w-16 h-16 bg-white rounded-xl shadow-ambient flex items-center justify-center mb-sm transform rotate-3">
<span class="material-symbols-outlined text-primary-container text-[32px]" data-icon="task_alt" data-weight="fill" style="font-variation-settings: 'FILL' 1;">task_alt</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-white mb-xs tracking-tight">TaskMate</h1>
<p class="font-body-lg text-body-lg text-on-primary-container opacity-90 max-w-[280px]">Kelola tugasmu. Raih prestasi.</p>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow px-margin-mobile -mt-md relative z-20 pb-xl">
<!-- Login Card -->
<div class="bg-surface rounded-[10px] p-md shadow-ambient">
<h2 class="font-headline-md text-headline-md text-text-primary mb-sm text-center">Selamat Datang</h2>
<p class="font-body-md text-body-md text-text-secondary mb-md text-center">Masuk ke akun TaskMate Anda untuk melanjutkan.</p>
<form action="#" class="space-y-sm" method="POST">
<!-- Email Input -->
<div class="flex flex-col">
<label class="font-label-md text-label-md text-text-secondary mb-xs uppercase tracking-wider" for="email">Email Universitas</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="mail">mail</span>
</span>
<input class="w-full pl-xl pr-sm py-xs border border-border rounded-[10px] bg-surface font-body-md text-body-md text-text-primary focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-all placeholder:text-outline-variant" id="email" name="email" placeholder="nama@kampus.ac.id" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col">
<div class="flex justify-between items-end mb-xs">
<label class="font-label-md text-label-md text-text-secondary uppercase tracking-wider" for="password">Kata Sandi</label>
<a class="font-body-md text-body-md text-secondary hover:text-primary transition-colors text-[13px]" href="#">Lupa Sandi?</a>
</div>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="lock">lock</span>
</span>
<input class="w-full pl-xl pr-sm py-xs border border-border rounded-[10px] bg-surface font-body-md text-body-md text-text-primary focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-all placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center pt-xs">
<input class="h-4 w-4 text-primary border-border rounded focus:ring-secondary cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-md text-body-md text-text-secondary cursor-pointer" for="remember-me">
                        Ingat saya
                    </label>
</div>
<!-- Actions -->
<div class="pt-sm space-y-sm">
<button class="w-full bg-primary text-on-primary font-body-lg text-body-lg font-medium py-sm rounded-lg hover:bg-surface-tint focus:ring-4 focus:ring-primary-container/50 transition-all shadow-sm flex items-center justify-center gap-xs" type="submit">
                        Masuk
                        <span class="material-symbols-outlined text-[18px]" data-icon="login">login</span>
</button>
<button class="w-full bg-transparent border border-border text-text-secondary font-body-lg text-body-lg font-medium py-sm rounded-lg hover:bg-surface-container-low focus:ring-4 focus:ring-surface-container-highest transition-all flex items-center justify-center" type="button">
                        Daftar Sekarang
                    </button>
</div>
</form>
<!-- Divider -->
<div class="mt-md relative">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-border"></div>
</div>
<div class="relative flex justify-center">
<span class="px-sm bg-surface font-body-md text-body-md text-text-secondary text-[13px]">atau masuk dengan</span>
</div>
</div>
<!-- Social Login -->
<div class="mt-md">
<button class="w-full bg-surface-container-lowest border border-border text-text-primary font-body-md text-body-md font-medium py-xs px-sm rounded-lg hover:bg-surface-container-low transition-all shadow-ambient flex items-center justify-center gap-sm" type="button">
<img alt="Google Logo" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDddX2POk-WFFnATHqELIh_vsICdW1q0khTQaChkZxV6250sFwRiC5A93s54O_A3_mWt_O-3u1T0SMRjDvKcRcuh9GLlvot-3bWohe0qedkv_dAu0KRKuXGzGSpx7zevwQT6NejBBrV3PgEWYJJmInM6NxN5iZshQ2t9jfXON5H_Q6cFP32XTyD23IUMH1mUXA3mjYmXijljh3SxdPZ8JRR-4dJ0ncxSZwkBK1b9-9IuSNnbwL5ByL8ZW6gKPOSx3agh08DdP79z6E"/>
                    Gunakan Akun Google
                </button>
</div>
</div>
</main>

<footer class="py-sm px-margin-mobile mt-auto text-center">
<p class="font-body-md text-body-md text-outline text-[12px]">© 2024 TaskMate Academic Portal. All rights reserved.</p>
</footer>
