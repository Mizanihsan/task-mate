<!DOCTYPE html>

<html lang="en"><head>

                    fontSize: {

<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-background min-h-screen flex text-on-surface">
<!-- Main Container -->
<div class="flex w-full min-h-screen">
<!-- Left Side: Branding (Hidden on small screens) -->
<div class="hidden md:flex md:w-1/2 bg-primary-container flex-col justify-center items-center p-lg relative overflow-hidden">
<!-- Decorative Elements -->
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-white opacity-5 blur-3xl"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-white opacity-5 blur-3xl"></div>
<div class="relative z-10 flex flex-col items-center text-center max-w-md">
<div class="mb-lg p-md bg-white rounded-2xl shadow-[0_8px_32px_rgba(0,0,0,0.1)]">
<img alt="TaskMate Logo" class="w-32 h-32 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBR9CWGKgAF6nuG8qgmyHlll3qR0VN_iHdg4O31IJI1KlKs0vuZmbAiUtSo9ZKzmOz4oB5nHxNKST6yRjUocaxf-fN1xCa14REfBgrGVJJMQD8EKcHmNxZhpgB6DXU08Dstq5sosa3DKoh8sSuub_39UOYLW6fbMbYHdFB1gKveHDsI-EqraQSEe1p6CUV1_7ovscvoo79teLKA1hbWq1VhXZJNYpYLfywCRmiwv8wBoqMkes6eSZf59kzGhu727wy5IAyj85aSmYY"/>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-primary font-bold mb-md">TaskMate</h1>
<p class="font-body-lg text-body-lg text-on-primary-container text-opacity-90 max-w-sm">
                    Kelola tugasmu. Raih prestasi. The ultimate companion for your academic journey.
                </p>
</div>
</div>
<!-- Right Side: Login Form -->
<div class="w-full md:w-1/2 flex items-center justify-center p-sm md:p-lg">
<div class="bg-surface w-full max-w-md p-lg md:p-xl rounded-xl shadow-[0_4px_12px_rgba(0,0,0,0.05)] border border-border">
<!-- Mobile Logo -->
<div class="md:hidden flex justify-center mb-lg">
<img alt="TaskMate Logo" class="w-16 h-16 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBR9CWGKgAF6nuG8qgmyHlll3qR0VN_iHdg4O31IJI1KlKs0vuZmbAiUtSo9ZKzmOz4oB5nHxNKST6yRjUocaxf-fN1xCa14REfBgrGVJJMQD8EKcHmNxZhpgB6DXU08Dstq5sosa3DKoh8sSuub_39UOYLW6fbMbYHdFB1gKveHDsI-EqraQSEe1p6CUV1_7ovscvoo79teLKA1hbWq1VhXZJNYpYLfywCRmiwv8wBoqMkes6eSZf59kzGhu727wy5IAyj85aSmYY"/>
</div>
<div class="mb-lg">
<h2 class="font-headline-md text-headline-md text-text-primary mb-xs font-semibold">Selamat Datang</h2>
<p class="font-body-md text-body-md text-text-secondary">
                        Masuk ke akun kamu untuk mulai mengelola tugas
                    </p>
</div>
<form class="space-y-md">
<!-- Email Input -->
<div>
<label class="block font-label-md text-label-md text-text-primary mb-xs uppercase tracking-wide" for="email">Email</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-sm text-text-secondary">
<span class="material-symbols-outlined" data-icon="mail">mail</span>
</span>
<input class="w-full pl-[44px] pr-sm py-sm bg-surface border border-outline-variant rounded-[10px] focus:ring-2 focus:ring-secondary focus:border-secondary font-body-md text-body-md text-text-primary transition-shadow" id="email" name="email" placeholder="mahasiswa@kampus.ac.id" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div>
<div class="flex justify-between items-center mb-xs">
<label class="block font-label-md text-label-md text-text-primary uppercase tracking-wide" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Lupa Password?</a>
</div>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-sm text-text-secondary">
<span class="material-symbols-outlined" data-icon="lock">lock</span>
</span>
<input class="w-full pl-[44px] pr-sm py-sm bg-surface border border-outline-variant rounded-[10px] focus:ring-2 focus:ring-secondary focus:border-secondary font-body-md text-body-md text-text-primary transition-shadow" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-on-primary py-sm rounded-lg font-body-md text-body-md font-semibold hover:bg-primary transition-all shadow-[0_4px_12px_rgba(61,82,160,0.2)] hover:shadow-[0_8px_20px_rgba(61,82,160,0.3)] transform hover:-translate-y-[1px]" type="submit">
                        Masuk
                    </button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-lg">
<div class="flex-grow border-t border-border"></div>
<span class="flex-shrink-0 mx-sm font-label-md text-label-md text-text-secondary uppercase">atau</span>
<div class="flex-grow border-t border-border"></div>
</div>
<!-- Register Button -->
<button class="w-full bg-transparent border border-outline-variant text-text-secondary py-sm rounded-lg font-body-md text-body-md font-medium hover:bg-surface-container-low hover:text-text-primary transition-colors" type="button">
                    Daftar Sekarang
                </button>
</div>
</div>
</div>
</body></html>
